version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: collabnet_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collabnet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collabnet && psql -U postgres -d collabnet -c 'CREATE EXTENSION IF NOT EXISTS vector;'"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collabnet_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabnet_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/collabnet
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/collabnet
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=collabnet-super-secure-production-jwt-secret-key-384bit
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
